<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>持倉監控</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f1f5f9; font-family: -apple-system, 'Noto Sans TC', sans-serif; padding: 20px 16px; max-width: 500px; margin: 0 auto; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid #1e3a5f; }
  .ma-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; margin-right: 3px; margin-top: 3px; display: inline-block; }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid #334155; border-top-color: #93c5fd; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #451a03; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #fbbf24; margin-bottom: 8px; }
  .btn { cursor: pointer; border: none; border-radius: 10px; font-weight: 700; font-family: inherit; }
  .btn-refresh { background: #1e3a5f; color: #93c5fd; padding: 7px 13px; font-size: 12px; border-radius: 8px; }
  .btn-copy { width: 100%; padding: 14px; background: linear-gradient(90deg, #0f766e, #1d4ed8); color: #fff; font-size: 15px; margin-top: 4px; margin-bottom: 8px; }
  .btn-copy.copied { background: #14532d; }
  .summary-box { background: #0f172a; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 12px; color: #64748b; line-height: 1.7; white-space: pre-wrap; font-family: monospace; border: 1px solid #1e3a5f; }
</style>
</head>
<body>

<!-- Header -->
<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
  <div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px">📊</div>
  <div style="flex:1">
    <div style="font-size:17px;font-weight:800">持倉監控</div>
    <div id="updateStatus" style="font-size:11px;color:#64748b">載入中...</div>
  </div>
  <button class="btn btn-refresh" onclick="fetchAll()">⟳ 更新</button>
</div>

<!-- Worker URL -->
<div class="card" style="margin-bottom:12px;padding:12px 14px">
  <div style="font-size:11px;color:#64748b;margin-bottom:5px;font-weight:600">Cloudflare Worker URL</div>
  <input type="url" id="workerUrl" value="https://yahoo-proxy.tomhsu8338.workers.dev"
    style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#94a3b8;padding:6px 10px;font-size:11px;outline:none">
</div>

<!-- Portfolio Cards -->
<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:8px;letter-spacing:0.5px">📈 持倉狀態</div>
<div id="portfolioCards"></div>
<div id="fetchErrors"></div>

<!-- Copy Button -->
<button class="btn btn-copy" id="copyBtn" onclick="copyData()">📋 複製今日數據 → 貼到 Claude 分析</button>

<!-- Preview -->
<div id="dataPreview" style="display:none">
  <div style="font-size:11px;color:#64748b;margin-bottom:4px">預覽（已複製）</div>
  <div class="summary-box" id="previewText"></div>
</div>

<div style="text-align:center;font-size:11px;color:#1e3a5f;padding:16px 0 8px">每30秒自動更新 · 數據來源 Yahoo Finance / MoneyDJ</div>

<script>
const PORTFOLIO = {
  voo:      { name:'VOO',     fullName:'標普500 Vanguard',      shares:12,    avgPrice:677.17, ticker:'VOO',       currency:'USD', role:'核心穩定資產 #1' },
  qqqm:     { name:'QQQM',    fullName:'納斯達克100 Invesco',   shares:13,    avgPrice:287.51, ticker:'QQQM',      currency:'USD', role:'成長型資產 #2' },
  allianz:  { name:'安聯科技',fullName:'安聯台灣科技基金',      units:638.3,  avgPrice:751.12, ticker:null,        currency:'TWD', role:'核心成長底倉 #3' },
  leverage: { name:'00631L',  fullName:'元大台灣50正2',         shares:5316,  avgPrice:33.43,  ticker:'00631L.TW', currency:'TWD', role:'報酬放大器 #4' },
};

const priceData = {};
const REFRESH_MS = 30 * 1000;
function workerUrl() { return document.getElementById('workerUrl').value.trim(); }
function calcMA(closes, n) {
  if (closes.length < n) return null;
  const s = closes.slice(-n);
  return parseFloat((s.reduce((a,b)=>a+b,0)/n).toFixed(2));
}
function pct(cur, ref) { return (((cur-ref)/ref)*100).toFixed(2); }

function renderCards() {
  const order = ['voo','qqqm','allianz','leverage'];
  document.getElementById('portfolioCards').innerHTML = order.map(id => {
    const p = PORTFOLIO[id];
    const d = priceData[id];
    const price = d?.price || null;
    const gain = price ? parseFloat(pct(price, p.avgPrice)) : null;
    const gainColor = gain === null ? '#64748b' : gain >= 0 ? '#4ade80' : '#f87171';

    const maHtml = d ? ['MA20','MA60','MA120','MA250'].map(ma => {
      const val = d[ma.toLowerCase()];
      if (!val) return '';
      const above = price >= val;
      return `<span class="ma-tag" style="background:${above?'#14532d':'#7f1d1d'};color:${above?'#86efac':'#fca5a5'}">${ma} ${above?'▲':'▼'} ${val}</span>`;
    }).join('') : '';

    const loadingHtml = d?.loading ? '<span class="spinner"></span>' : '';
    const priceHtml = price
      ? `<div style="font-size:18px;font-weight:800;color:#f1f5f9">${price.toFixed(price < 100 ? 3 : 2)}</div>
         <div style="font-size:12px;color:${gainColor};margin-top:1px">${gain>=0?'+':''}${gain}% vs 均價</div>`
      : `<div style="color:#64748b;font-size:13px">等待中 ${loadingHtml}</div>`;

    const updatedAt = d?.fetchedAt
      ? `<div style="font-size:10px;color:#334155;margin-top:6px">更新：${new Date(d.fetchedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>`
      : '';

    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-size:15px;font-weight:700;color:#f1f5f9">${p.name}</div>
          <div style="font-size:11px;color:#64748b;margin-top:1px">${p.role}</div>
          <div style="font-size:10px;color:#475569;margin-top:1px">均價 $${p.avgPrice} · ${p.shares||p.units}${p.shares?'股':'單位'}</div>
        </div>
        <div style="text-align:right">${priceHtml}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:2px">${maHtml}</div>
      ${updatedAt}
    </div>`;
  }).join('');
}

async function fetchTicker(id) {
  const p = PORTFOLIO[id];
  priceData[id] = { ...priceData[id], loading: true };
  renderCards();
  try {
    let closes = [];
    if (id === 'allianz') {
      const res = await fetch(`${workerUrl()}?allianz=1`);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      const items = json.items || [];
      if (!items.length) throw new Error('no nav data');
      closes = items.map(it => Array.isArray(it) ? it[1] : (it.nav || it[1])).filter(v => v && !isNaN(v));
    } else {
      const res = await fetch(`${workerUrl()}?symbol=${encodeURIComponent(p.ticker)}&interval=1d&range=1y`);
      const json = await res.json();
      const chart = json?.chart?.result?.[0];
      if (!chart) throw new Error('no chart data');
      closes = chart.indicators.quote[0].close.filter(Boolean);
    }
    priceData[id] = {
      price: closes[closes.length - 1],
      ma20: calcMA(closes, 20), ma60: calcMA(closes, 60),
      ma120: calcMA(closes, 120), ma250: calcMA(closes, 250),
      fetchedAt: Date.now(), loading: false
    };
    // Clear this ticker's error
    document.getElementById('fetchErrors').innerHTML =
      document.getElementById('fetchErrors').innerHTML
        .split('\n').filter(l => !l.includes(p.name)).join('\n');
  } catch(e) {
    priceData[id] = { ...priceData[id], loading: false };
    const box = document.getElementById('fetchErrors');
    if (!box.innerHTML.includes(p.name)) {
      box.innerHTML += `<div class="error-box">⚠️ ${p.name} 抓取失敗：${e.message}</div>`;
    }
  }
  renderCards();
}

async function fetchAll() {
  document.getElementById('updateStatus').innerHTML = '更新中... <span class="spinner"></span>';
  await Promise.all(Object.keys(PORTFOLIO).map(fetchTicker));
  const t = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updateStatus').textContent = `最後更新：${t} · 每30秒自動刷新`;
}

function copyData() {
  const lines = ['📊 今日持倉數據（請幫我分析今日加倉決策）', ''];
  const order = ['voo','qqqm','allianz','leverage'];
  for (const id of order) {
    const p = PORTFOLIO[id];
    const d = priceData[id];
    if (!d?.price) { lines.push(`${p.name}：尚無數據`); continue; }
    const gain = pct(d.price, p.avgPrice);
    const maStr = [
      d.ma20  ? `MA20=${ d.ma20 }` : null,
      d.ma60  ? `MA60=${ d.ma60 }` : null,
      d.ma120 ? `MA120=${d.ma120}` : null,
      d.ma250 ? `MA250=${d.ma250}` : null,
    ].filter(Boolean).join(' | ');
    const pricePos = d.price >= (d.ma20||0) ? '在MA20上方' : d.price >= (d.ma60||0) ? '跌破MA20' : d.price >= (d.ma120||0) ? '跌破MA60' : d.price >= (d.ma250||0) ? '跌破MA120' : '跌破MA250';
    lines.push(`【${p.name}】${p.role}`);
    lines.push(`  現價：$${d.price.toFixed(d.price<100?3:2)}　均價：$${p.avgPrice}　損益：${gain>=0?'+':''}${gain}%`);
    lines.push(`  ${maStr}`);
    lines.push(`  技術位置：${pricePos}`);
    lines.push('');
  }
  lines.push('剩餘子彈：__萬台幣（請填入）');
  lines.push('昨天加倉：（請填入或無）');
  lines.push('市場備註：（選填）');

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已複製！貼到 Claude 對話框即可';
    btn.classList.add('copied');
    document.getElementById('previewText').textContent = text;
    document.getElementById('dataPreview').style.display = 'block';
    setTimeout(() => {
      btn.textContent = '📋 複製今日數據 → 貼到 Claude 分析';
      btn.classList.remove('copied');
    }, 3000);
  }).catch(() => {
    // fallback for older Safari
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('previewText').textContent = text;
    document.getElementById('dataPreview').style.display = 'block';
    alert('已複製！貼到 Claude 對話框即可');
  });
}

fetchAll();
setInterval(fetchAll, REFRESH_MS);
</script>
</body>
</html>
