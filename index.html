<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>加倉決策系統</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f1f5f9; font-family: -apple-system, 'Noto Sans TC', sans-serif; padding: 20px 16px; max-width: 500px; margin: 0 auto; }
  input, textarea { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; padding: 9px 12px; font-size: 14px; outline: none; width: 100%; font-family: inherit; }
  textarea { resize: none; }
  button { cursor: pointer; border: none; border-radius: 10px; font-weight: 700; font-family: inherit; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #1e3a5f; }
  .label { font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
  .ticker-name { font-size: 15px; font-weight: 700; color: #f1f5f9; }
  .ticker-sub { font-size: 11px; color: #64748b; margin-top: 1px; }
  .ticker-price { font-size: 18px; font-weight: 800; color: #f1f5f9; }
  .ticker-gain { font-size: 12px; margin-top: 1px; }
  .ma-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; margin-right: 3px; margin-top: 3px; display: inline-block; }
  .btn-main { width: 100%; padding: 14px; background: linear-gradient(90deg, #1d4ed8, #7c3aed); color: #fff; font-size: 16px; margin-bottom: 20px; }
  .btn-main:disabled { background: #1e3a5f; color: #64748b; cursor: not-allowed; }
  .btn-refresh { background: #1e3a5f; color: #93c5fd; padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  .result-signal { border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
  .rec-row { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #0f172a; }
  .rec-row:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .rec-icon { min-width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #334155; border-top-color: #93c5fd; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #451a03; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #fbbf24; margin-bottom: 8px; }
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
  <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:20px">📊</div>
  <div style="flex:1">
    <div style="font-size:18px;font-weight:800">加倉決策系統 Pro</div>
    <div id="updateStatus" style="font-size:11px;color:#64748b">載入中...</div>
  </div>
  <button class="btn-refresh" onclick="fetchAll()">⟳ 立即更新</button>
</div>

<!-- Worker URL -->
<div class="card" style="margin-bottom:14px">
  <div class="label">Cloudflare Worker URL</div>
  <input type="url" id="workerUrl" value="https://yahoo-proxy.tomhsu8338.workers.dev" style="font-size:12px;color:#94a3b8">
</div>

<!-- Portfolio Cards -->
<div class="label" style="margin-bottom:10px">📈 持倉狀態</div>
<div id="portfolioCards"></div>

<!-- Errors -->
<div id="fetchErrors"></div>

<!-- Context inputs -->
<div class="card" style="margin-top:8px">
  <div class="label" style="margin-bottom:12px">💰 資金與操作狀態</div>
  <div style="margin-bottom:10px">
    <div class="label">剩餘子彈（萬台幣）</div>
    <input type="number" id="bullet" value="20" style="font-size:16px">
  </div>
  <div style="margin-bottom:10px">
    <div class="label">昨天加倉標的</div>
    <input type="text" id="prevAdded" placeholder="例：VOO 或 無">
  </div>
  <div>
    <div class="label">市場備註（選填）</div>
    <textarea id="marketNote" rows="2" placeholder="例：Fed發言偏鷹、科技股恐慌..."></textarea>
  </div>
</div>

<button class="btn-main" id="analyzeBtn" onclick="analyze()">🔍 生成今日加倉決策</button>

<div id="result"></div>

<script>
const PORTFOLIO = {
  voo:      { name:'VOO',    fullName:'標普500 Vanguard',    shares:12,    avgPrice:677.17, ticker:'VOO',       currency:'USD', role:'核心穩定資產', priority:1, autoFetch:true },
  qqqm:     { name:'QQQM',   fullName:'納斯達克100 Invesco', shares:13,    avgPrice:287.51, ticker:'QQQM',      currency:'USD', role:'成長型資產',   priority:2, autoFetch:true },
  leverage: { name:'00631L', fullName:'元大台灣50正2',        shares:5316,  avgPrice:33.43,  ticker:'00631L.TW', currency:'TWD', role:'報酬放大器',   priority:4, autoFetch:true },
  allianz:  { name:'安聯科技',fullName:'安聯台灣科技基金',   units:638.3,  avgPrice:751.12, ticker:null,        currency:'TWD', role:'核心成長底倉', priority:3, autoFetch:true, allianzFetch:true },
};

const priceData = {};
const REFRESH_MS = 30 * 1000;

function workerUrl() { return document.getElementById('workerUrl').value.trim(); }

function calcMA(closes, n) {
  if (closes.length < n) return null;
  const s = closes.slice(-n);
  return parseFloat((s.reduce((a,b)=>a+b,0)/n).toFixed(4));
}

function pct(cur, ref) { return (((cur-ref)/ref)*100).toFixed(2); }

function renderCards() {
  const ids = ['voo','qqqm','leverage','allianz'];
  document.getElementById('portfolioCards').innerHTML = ids.map(id => {
    const p = PORTFOLIO[id];
    const d = priceData[id];
    const price = d?.price || null;
    const gain = price ? parseFloat(pct(price, p.avgPrice)) : null;
    const gainColor = gain === null ? '#64748b' : gain >= 0 ? '#4ade80' : '#f87171';

    const maHtml = d ? ['MA20','MA60','MA120','MA250'].map(ma => {
      const val = d[ma.toLowerCase()];
      if (!val) return '';
      const above = price >= val;
      return `<span class="ma-tag" style="background:${above?'#14532d':'#7f1d1d'};color:${above?'#86efac':'#fca5a5'}">${ma} ${above?'▲':'▼'} ${val.toFixed(1)}</span>`;
    }).join('') : '';

    const loadingDot = d?.loading ? '<span class="spinner"></span>' : '';
    const priceHtml = price
      ? `<div class="ticker-price">${price < 100 ? price.toFixed(3) : price.toFixed(2)}</div><div class="ticker-gain" style="color:${gainColor}">${gain>=0?'+':''}${gain}% vs 均價</div>`
      : `<div style="color:#64748b;font-size:13px">等待中${loadingDot}</div>`;

    const updatedAt = d?.fetchedAt ? `更新：${new Date(d.fetchedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}` : '';

    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div class="ticker-name">${p.name}</div><div class="ticker-sub">${p.role}</div></div>
        <div style="text-align:right">${priceHtml}</div>
      </div>
      <div>${maHtml}</div>
      ${updatedAt ? `<div style="font-size:10px;color:#334155;margin-top:6px">${updatedAt}</div>` : ''}
    </div>`;
  }).join('');
}

async function fetchTicker(id) {
  const p = PORTFOLIO[id];
  priceData[id] = { ...priceData[id], loading: true };
  renderCards();
  try {
    if (p.allianzFetch) {
      const res = await fetch(`${workerUrl()}?allianz=1`);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      // 基金只有單一淨值，無法算 MA，設為 null
      priceData[id] = { price: json.nav, ma20: null, ma60: null, ma120: null, ma250: null, fetchedAt: Date.now(), loading: false };
    } else {
      const res = await fetch(`${workerUrl()}?symbol=${p.ticker}&interval=1d&range=1y`);
      const json = await res.json();
      const chart = json?.chart?.result?.[0];
      if (!chart) throw new Error('no chart data');
      const closes = chart.indicators.quote[0].close.filter(Boolean);
      priceData[id] = {
        price: closes[closes.length-1],
        ma20:  calcMA(closes, 20),
        ma60:  calcMA(closes, 60),
        ma120: calcMA(closes, 120),
        ma250: calcMA(closes, 250),
        fetchedAt: Date.now(), loading: false
      };
    }
    document.getElementById('fetchErrors').innerHTML = '';
  } catch(e) {
    priceData[id] = { ...priceData[id], loading: false };
    document.getElementById('fetchErrors').innerHTML += `<div class="error-box">⚠️ ${PORTFOLIO[id].name} 抓取失敗：${e.message}</div>`;
  }
  renderCards();
}

async function fetchAll() {
  const ids = Object.keys(PORTFOLIO);
  document.getElementById('updateStatus').innerHTML = '更新中... <span class="spinner"></span>';
  await Promise.all(ids.map(fetchTicker));
  const t = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updateStatus').textContent = `更新：${t} · 每30秒自動刷新`;
}

// Auto refresh
fetchAll();
setInterval(fetchAll, REFRESH_MS);

// ── Claude AI analysis ──────────────────────────────────────────────────────
const SYSTEM_PROMPT = `你是一個嚴格的投資紀律執行系統。

【持倉】
- VOO 12股，均價$677.17（美元）
- QQQM 13股，均價$287.51（美元）
- 安聯台灣科技基金 638.3單位，均價$751.12（台幣）
- 00631L 5316股，均價$33.43（台幣）

【技術面判斷（MA位置）】
1. 價格>MA20>MA60>MA120>MA250：強勢，不加倉
2. 價格<MA20，>MA60：小幅回檔，可小量加倉(-3~-5%)
3. 價格<MA60，>MA120：中度回檔，正常加倉(-5~-8%)
4. 價格<MA120，>MA250：較深回檔，積極加倉(-8~-10%)
5. 價格<MA250：極度超賣，停止加倉

【跌幅分級】0~-3%不加；-3~-5%小量；-5~-8%正常；-8~-10%積極；>-10%停止

【子彈規則】單次≤剩餘30%；每筆2~5萬台幣；不連續兩天加同標的；不補滿單一檔

【優先順序】VOO > QQQM > 安聯 > 00631L

【安聯專屬】已有大部位。加倉需：台股或科技跌幅≥-8% + 恐慌賣壓 + 尚有子彈 + 不適合再加QQQM。每次2~3萬，不連續提醒。安聯基金無法計算MA，以跌幅與市場情緒判斷。

【00631L專屬】需同時：大盤跌幅-8~-10% + 不再創新低（止跌橫盤）+ 尚有子彈。否則一律不加。

請只輸出JSON（不加markdown）：
{"shouldAdd":bool,"overallSignal":"積極加倉|正常加倉|小量加倉|不加倉|停止加倉","recommendations":[{"ticker":"名稱","action":"加倉|不加倉","amount":"N萬或null","reason":"理由","technicalBasis":"MA位置"}],"allianzOk":bool,"leverageOk":bool,"remainingBullet":"N","summary":"2~3句冷靜摘要","noAddReason":"原因或null"}`;

async function analyze() {
  const missing = Object.keys(PORTFOLIO).filter(id => !priceData[id]?.price);
  if (missing.length > 0) { alert('尚缺股價：' + missing.map(id=>PORTFOLIO[id].name).join('、')); return; }
  const bullet = document.getElementById('bullet').value;
  if (!bullet) { alert('請輸入剩餘子彈'); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true; btn.textContent = '🤖 分析中...';
  document.getElementById('result').innerHTML = '';

  const lines = Object.keys(PORTFOLIO).map(id => {
    const p = PORTFOLIO[id]; const d = priceData[id];
    const price = d?.price;
    const drop = pct(price, p.avgPrice);
    const ma = (p.allianzFetch || !d?.ma20)
      ? '（基金無MA數據，以跌幅與市場情緒判斷）'
      : `MA20:$${d.ma20?.toFixed(2)} MA60:$${d.ma60?.toFixed(2)} MA120:$${d.ma120?.toFixed(2)} MA250:$${d.ma250?.toFixed(2)}`;
    return `${p.name}：現價$${price?.toFixed(p.currency==='TWD'?3:2)}（均價$${p.avgPrice}，${drop}%） ${ma}`;
  }).join('\n');

  const userMsg = `今日數據：\n${lines}\n\n剩餘子彈：${bullet}萬\n昨天加倉：${document.getElementById('prevAdded').value||'無'}\n備註：${document.getElementById('marketNote').value||'無'}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1200, system:SYSTEM_PROMPT, messages:[{role:'user',content:userMsg}] })
    });
    const data = await res.json();
    const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const r = JSON.parse(raw.replace(/```json|```/g,'').trim());
    renderResult(r);
  } catch(e) { alert('分析失敗：'+e.message); }
  btn.disabled = false; btn.textContent = '🔍 生成今日加倉決策';
}

const SIG = {
  '積極加倉': { bg:'#16a34a', text:'#fff',    emoji:'💪' },
  '正常加倉': { bg:'#2563eb', text:'#fff',    emoji:'✅' },
  '小量加倉': { bg:'#b45309', text:'#fff',    emoji:'🔸' },
  '不加倉':   { bg:'#374151', text:'#9ca3af', emoji:'⏸' },
  '停止加倉': { bg:'#7f1d1d', text:'#fca5a5', emoji:'🛑' },
};

function renderResult(r) {
  const s = SIG[r.overallSignal] || SIG['不加倉'];
  const recsHtml = (r.recommendations||[]).map(rec => `
    <div class="rec-row">
      <div class="rec-icon" style="background:${rec.action==='加倉'?'#14532d':'#1e293b'};border:1px solid ${rec.action==='加倉'?'#16a34a':'#334155'}">
        ${rec.action==='加倉'?'✅':'⏸'}
      </div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:700;font-size:14px">${rec.ticker}</span>
          ${rec.amount?`<span style="background:#1d4ed8;color:#bfdbfe;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">${rec.amount}</span>`:''}
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-top:3px;line-height:1.5">${rec.reason}</div>
        ${rec.technicalBasis?`<div style="font-size:11px;color:#475569;margin-top:3px;font-style:italic">${rec.technicalBasis}</div>`:''}
      </div>
    </div>`).join('');

  const allianzBadge = badge(r.allianzOk, '✅ 可加倉', '❌ 不加倉');
  const leverageBadge = badge(r.leverageOk, '✅ 條件成立', '❌ 條件未達');

  document.getElementById('result').innerHTML = `
    <div class="result-signal" style="background:${s.bg}">
      <div>
        <div style="font-size:22px;font-weight:800;color:${s.text}">${s.emoji} ${r.overallSignal}</div>
        <div style="font-size:12px;color:${s.text};opacity:0.7;margin-top:2px">整體市場信號</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:${s.text};opacity:0.7">執行後剩餘子彈</div>
        <div style="font-size:22px;font-weight:800;color:${s.text}">${r.remainingBullet}萬</div>
      </div>
    </div>
    <div class="card">
      <div class="label">局勢摘要</div>
      <div style="font-size:14px;color:#cbd5e1;line-height:1.7;margin-top:4px">${r.summary}</div>
      ${r.noAddReason?`<div style="margin-top:10px;font-size:12px;color:#f59e0b;background:#451a03;border-radius:8px;padding:8px 12px">不加倉：${r.noAddReason}</div>`:''}
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:12px">各標的判斷</div>
      ${recsHtml}
    </div>
    <div class="card" style="display:flex;justify-content:space-around">
      <div style="text-align:center">
        <div style="font-size:11px;color:#64748b;margin-bottom:6px">安聯台灣科技</div>
        ${allianzBadge}
      </div>
      <div style="width:1px;background:#0f172a"></div>
      <div style="text-align:center">
        <div style="font-size:11px;color:#64748b;margin-bottom:6px">00631L 正二</div>
        ${leverageBadge}
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:#334155;padding-bottom:20px">
      以上為系統判斷，最終決策由你負責 · 紀律優先於情緒
    </div>`;
}

function badge(ok, t, f) {
  return `<span style="padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:${ok?'#14532d':'#7f1d1d'};color:${ok?'#86efac':'#fca5a5'};border:1px solid ${ok?'#166534':'#991b1b'}">${ok?t:f}</span>`;
}
</script>
</body>
</html>
