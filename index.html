const priceData = {};
let bulletData = { balance: 200000, records: [] };

function workerUrl() { return document.getElementById('workerUrl').value.trim(); }
function calcMA(closes, n) {
  if (closes.length < n) return null;
  return parseFloat((closes.slice(-n).reduce((a,b)=>a+b,0)/n).toFixed(2));
}
function pct(cur, ref) { return (((cur-ref)/ref)*100).toFixed(2); }
function fmtMoney(n) { return Math.round(n).toLocaleString('zh-TW'); }

// 計算自「近期高點」（近60交易日，約3個月）以來的累積跌幅，以及是否止穩（今日收盤未創新低）
function calcDrawdown(closes) {
  if (!closes || closes.length < 2) return { recentHigh:null, drawdownPct:null, isStabilizing:true };
  const window = closes.slice(-60);
  const recentHigh = Math.max(...window);
  const cur = closes[closes.length-1];
  const drawdownPct = parseFloat((((cur-recentHigh)/recentHigh)*100).toFixed(2));
  const isStabilizing = cur >= closes[closes.length-2];
  return { recentHigh: parseFloat(recentHigh.toFixed(2)), drawdownPct, isStabilizing };
}

// ── VIX ──
let vixData = { value:null, fetchedAt:null, loading:false };
async function fetchVIX() {
  vixData = { ...vixData, loading:true };
  try {
    const res = await fetch(`${workerUrl()}?symbol=${encodeURIComponent('^VIX')}&interval=1d&range=5d`);
    const json = await res.json();
    const chart = json?.chart?.result?.[0];
    if (!chart) throw new Error('no chart data');
    const closes = chart.indicators.quote[0].close.filter(Boolean);
    vixData = { value: parseFloat(closes[closes.length-1].toFixed(2)), fetchedAt:Date.now(), loading:false };
  } catch(e) {
    vixData = { ...vixData, loading:false, error:e.message };
  }
}

// ── 警示等級判定（依新觸發/反洗版規則使用）──
function vooAlertLevel(dd) { if (dd==null) return 0; if (dd<=-5) return 2; if (dd<=-3) return 1; return 0; }
function qqqmAlertLevel(dd) { if (dd==null) return 0; if (dd<=-10) return 3; if (dd<=-7) return 2; if (dd<=-5) return 1; return 0; }
function allianzAlertLevel(techDd) { if (techDd==null) return 0; return techDd<=-8 ? 1 : 0; } // techDd = QQQM跌幅（代表科技類股）
function leverageAlertLevel(dd, isStabilizing) { if (dd==null) return 0; return (dd<=-8 && isStabilizing) ? 1 : 0; }
function vixAlertLevel(v) { if (v==null) return 0; if (v>=30) return 2; if (v>=25) return 1; return 0; }

const ALERT_LABELS = {
  voo: { name:'VOO', levels:['正常','-3% 通知','-5% 加強通知'] },
  qqqm: { name:'QQQM', levels:['正常','-5% 通知','-7% 主要警示','-10% 強烈警示'] },

// ── Portfolio Cards ──
function renderCards() {
  document.getElementById('portfolioCards').innerHTML = ['voo','qqqm','allianz','leverage'].map(id => {
    const p = PORTFOLIO[id], d = priceData[id];
    const price = d?.price;
    const gain = price ? parseFloat(pct(price, p.avgPrice)) : null;
    const gainColor = gain===null?'#64748b':gain>=0?'#4ade80':'#f87171';
    const maHtml = d ? ['MA20','MA60','MA120','MA250'].map(ma => {
      const val = d[ma.toLowerCase()]; if (!val) return '';
      const above = price >= val;
      return `<span class="ma-tag" style="background:${above?'#14532d':'#7f1d1d'};color:${above?'#86efac':'#fca5a5'}">${ma} ${above?'▲':'▼'} ${val}</span>`;
    }).join('') : '';
    const priceHtml = price
      ? `<div style="font-size:18px;font-weight:800">${price.toFixed(price<100?3:2)}</div><div style="font-size:12px;color:${gainColor};margin-top:1px">${gain>=0?'+':''}${gain}% vs 均價</div>`
      : `<div style="color:#64748b;font-size:13px">等待中 ${d?.loading?'<span class="spinner"></span>':''}</div>`;
    const dd = d?.drawdownPct;
    const ddColor = dd==null?'#64748b':dd<=-8?'#f87171':dd<=-3?'#fbbf24':'#64748b';
    const ddHtml = dd!=null ? `<div style="font-size:11px;color:${ddColor};margin-top:2px">自高點 ${dd}%</div>` : '';
    const ts = d?.fetchedAt ? `<div style="font-size:10px;color:#334155;margin-top:5px">更新：${new Date(d.fetchedAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>` : '';
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div style="font-size:15px;font-weight:700">${p.name}</div><div style="font-size:11px;color:#64748b;margin-top:1px">${p.role}</div><div style="font-size:10px;color:#475569;margin-top:1px">均價 $${p.avgPrice}</div></div>
        <div style="text-align:right">${priceHtml}${ddHtml}</div>
      </div>
      <div>${maHtml}</div>${ts}
    </div>`;
  }).join('');
  renderVixCard();
}

function renderVixCard() {
  const v = vixData.value;
  const level = vixAlertLevel(v);
  const color = level>=2 ? '#f87171' : level>=1 ? '#fbbf24' : '#4ade80';
  const label = v==null ? (vixData.loading?'載入中...':'—') : v.toFixed(2);
  document.getElementById('vixCard').innerHTML = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:10px">
    <div><div style="font-size:13px;font-weight:700">😨 VIX 恐慌指數</div><div style="font-size:10px;color:#64748b;margin-top:1px">${ALERT_LABELS.vix.levels[level]}</div></div>
    <div style="font-size:20px;font-weight:800;color:${color}">${label}</div>
  </div>`;
}

async function fetchTicker(id) {

  priceData[id] = { ...priceData[id], loading: true };
  renderCards();
  try {
    let closes = [];
    if (id === 'allianz') {
      const res = await fetch(`${workerUrl()}?allianz=1`);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      closes = (json.items||[]).map(it=>Array.isArray(it)?it[1]:it.nav).filter(v=>v&&!isNaN(v));
    } else {
      const res = await fetch(`${workerUrl()}?symbol=${encodeURIComponent(p.ticker)}&interval=1d&range=1y`);
      const json = await res.json();
      const chart = json?.chart?.result?.[0];
      if (!chart) throw new Error('no chart data');
      closes = chart.indicators.quote[0].close.filter(Boolean);
    }
    priceData[id] = { price:closes[closes.length-1], ma20:calcMA(closes,20), ma60:calcMA(closes,60), ma120:calcMA(closes,120), ma250:calcMA(closes,250), fetchedAt:Date.now(), loading:false, ...calcDrawdown(closes) };
  } catch(e) {
    priceData[id] = { ...priceData[id], loading:false };
    const box = document.getElementById('fetchErrors');
    if (!box.innerHTML.includes(p.name)) box.innerHTML += `<div class="error-box">⚠️ ${p.name} 抓取失敗：${e.message}</div>`;
  }
  renderCards();
}

async function fetchAll() {
  document.getElementById('updateStatus').innerHTML = '更新中... <span class="spinner"></span>';
  document.getElementById('fetchErrors').innerHTML = '';
  await Promise.all([...Object.keys(PORTFOLIO).map(fetchTicker), fetchVIX().then(renderCards)]);
  const t = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updateStatus').textContent = `最後更新：${t} · 每30秒自動刷新`;
}

// ── Bullet ──
async function loadBullet() {
  try {
    const res = await fetch(`${workerUrl()}/bullet`);
    bulletData = await res.json();
    renderBullet();
  } catch(e) {
    document.getElementById('bulletRecords').innerHTML = `<div class="error-box">載入失敗：${e.message}</div>`;
  }
}

function renderBullet() {
  document.getElementById('bulletBalance').textContent = '$' + fmtMoney(bulletData.balance);
  const records = bulletData.records || [];
  document.getElementById('bulletRecords').innerHTML = records.length === 0
    ? '<div style="color:#475569;font-size:13px;text-align:center;padding:12px">尚無紀錄</div>'
    : records.map(r => {
        const isAdd = r.type === 'add';
        const isSet = r.type === 'set';
        const color = isAdd ? '#4ade80' : isSet ? '#93c5fd' : '#f87171';
        const sign = isAdd ? '+' : isSet ? '=' : '-';
        const amt = isSet ? fmtMoney(r.amount) : fmtMoney(Math.abs(r.amount));
        return `<div class="record-row">
          <div>
            <div style="font-weight:600;font-size:13px">${r.label}</div>
            <div style="font-size:11px;color:#64748b;margin-top:2px">${r.date} · 餘額 $${fmtMoney(r.balance)}</div>
          </div>
          <div style="font-size:15px;font-weight:800;color:${color}">${sign}$${amt}</div>
        </div>`;
      }).join('');
}

async function submitBullet() {
  const action = document.getElementById('bulletAction').value;
  const amount = parseFloat(document.getElementById('bulletAmount').value);
  const label = document.getElementById('bulletLabel').value.trim();
  if (!amount || isNaN(amount)) { alert('請輸入金額'); return; }
  try {
    const res = await fetch(`${workerUrl()}/bullet`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, amount, label: label || (action==='deduct'?'加倉':action==='add'?'薪水補充':'手動設定') })
    });
    bulletData = await res.json();
    renderBullet();
    document.getElementById('bulletAmount').value = '';
    document.getElementById('bulletLabel').value = '';
  } catch(e) { alert('操作失敗：' + e.message); }
}

// ── AI Analysis ──
let lastNotification = '';

function renderAlertBadges(levels, triggered) {
  return Object.keys(levels).map(k => {
    const info = ALERT_LABELS[k];
    const lvl = levels[k];
    const isTriggered = !!triggered[k];
    const color = lvl===0 ? '#374151' : lvl>=2 ? '#7f1d1d' : '#b45309';
    const textColor = lvl===0 ? '#9ca3af' : lvl>=2 ? '#fca5a5' : '#fde68a';
    const ring = isTriggered ? 'box-shadow:0 0 0 2px #22d3ee;' : '';
    return `<span class="badge" style="background:${color};color:${textColor};margin:0 4px 6px 0;${ring}">${info.name}：${info.levels[lvl]}${isTriggered?' 🆕':''}</span>`;
  }).join('');
}

function copyNotification() {
  if (!lastNotification) return;
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = lastNotification; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(lastNotification).catch(fallback);
  } else { fallback(); }
  const btn = document.getElementById('copyNotifBtn');
  if (btn) { const old = btn.textContent; btn.textContent = '已複製 ✓'; setTimeout(()=>btn.textContent=old, 1500); }
}

async function runAnalysis(force) {
  const keys = Object.keys(PORTFOLIO);
  const missing = keys.filter(id => !priceData[id]?.price);
  if (missing.length > 0) {
    alert('尚缺股價：' + missing.map(id=>PORTFOLIO[id].name).join('、'));
    return;
  }
  if (vixData.value == null) {
    alert('VIX 尚未載入，請稍候或點擊「更新」');
    return;
  }

  const analyzeBtn = document.getElementById('analyzeBtn');
  const forceBtn = document.getElementById('forceBtn');
  analyzeBtn.disabled = true; forceBtn.disabled = true;
  const oldAnalyzeText = analyzeBtn.textContent;
  analyzeBtn.textContent = '🤖 檢查中...';
  document.getElementById('aiResult').innerHTML = '<div class="card" style="text-align:center;padding:24px;color:#64748b"><span class="spinner"></span> 檢查訊號中，請稍候...</div>';

  try {
    // ① 計算各標的目前警示等級
    const vooDD = priceData.voo.drawdownPct;
    const qqqmDD = priceData.qqqm.drawdownPct;
    const allianzDD = priceData.allianz.drawdownPct;
    const leverageDD = priceData.leverage.drawdownPct;
    const vix = vixData.value;

    const currentLevels = {
      voo: vooAlertLevel(vooDD),
      qqqm: qqqmAlertLevel(qqqmDD),
      allianz: allianzAlertLevel(qqqmDD),
      leverage: leverageAlertLevel(leverageDD, priceData.leverage.isStabilizing),
      vix: vixAlertLevel(vix),
    };

    await loadAlertState();
    const triggered = {};
    let hasTrigger = false;
    for (const k of Object.keys(currentLevels)) {
      const prev = alertState[k] || 0;
      if (currentLevels[k] > prev) { triggered[k] = true; hasTrigger = true; }
    }

    const badgesHtml = renderAlertBadges(currentLevels, triggered);

    if (!hasTrigger && !force) {
      await saveAlertState(currentLevels);
      document.getElementById('aiResult').innerHTML =
        '<div class="card" style="text-align:center;padding:20px;margin-bottom:10px">'
          + '<div style="font-size:28px;margin-bottom:6px">✅</div>'
          + '<div style="font-size:15px;font-weight:800;margin-bottom:4px">目前無新訊號</div>'
          + '<div style="font-size:12px;color:#64748b">市場處於正常範圍，未跨越任何警示門檻</div>'
        + '</div>'
        + '<div class="card" style="margin-bottom:10px">'
          + '<div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:8px">目前各標的狀態</div>'
          + '<div>' + badgesHtml + '</div>'
        + '</div>'
        + '<div style="text-align:center;font-size:11px;color:#334155;padding:8px 0">若想無視門檻、強制取得AI完整分析，請點「強制分析」</div>';
      analyzeBtn.disabled = false; forceBtn.disabled = false;
      analyzeBtn.textContent = oldAnalyzeText;
      return;
    }

    analyzeBtn.textContent = '🤖 分析中...';
    document.getElementById('aiResult').innerHTML = '<div class="card" style="text-align:center;padding:24px;color:#64748b"><span class="spinner"></span> AI 分析中，請稍候...</div>';

    const NEWLINE = String.fromCharCode(10);

    const lines = keys.map(id => {
      const p = PORTFOLIO[id], d = priceData[id];
      const gain = pct(d.price, p.avgPrice);
      const maStr = [d.ma20?'MA20='+d.ma20:null, d.ma60?'MA60='+d.ma60:null, d.ma120?'MA120='+d.ma120:null, d.ma250?'MA250='+d.ma250:null].filter(Boolean).join(' | ');
      const pos = d.price>=(d.ma20||0)?'在MA20上方':d.price>=(d.ma60||0)?'跌破MA20':d.price>=(d.ma120||0)?'跌破MA60':d.price>=(d.ma250||0)?'跌破MA120':'跌破MA250';
      const ddStr = d.drawdownPct!=null ? ('自高點('+d.recentHigh+')跌幅'+d.drawdownPct+'%') : '';
      return p.name+'：現價$'+d.price.toFixed(d.price<100?3:2)+' 均價$'+p.avgPrice+' '+(gain>=0?'+':'')+gain+'% | '+maStr+' | '+pos+' | '+ddStr+' | 目前警示等級='+currentLevels[id]+(triggered[id]?'（新觸發！）':'');
    }).join(NEWLINE);

    const vixLine = 'VIX：'+vix+' | 目前警示等級='+currentLevels.vix+(triggered.vix?'（新觸發！）':'');
    const leverageStabilizeLine = '00631L是否止穩（今日收盤未創新低）：' + (priceData.leverage.isStabilizing ? '是' : '否');

    const triggeredNames = Object.keys(triggered).filter(k=>triggered[k]).map(k=>ALERT_LABELS[k].name);
    const triggeredLine = triggeredNames.length ? ('本次新觸發項目：' + triggeredNames.join('、')) : '本次無新觸發項目（此為強制分析）';

    const bulletWan = (bulletData.balance / 10000).toFixed(1);
    const today = new Date();
    const dateStr = today.toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric'});
    const promptParts = [
      SYSTEM_PROMPT,
      '今天日期：' + dateStr,
      '【今日市場數據】' + NEWLINE + lines + NEWLINE + vixLine + NEWLINE + leverageStabilizeLine,
      '【門檻觸發狀態】' + NEWLINE + triggeredLine,
      '可用現金：' + bulletData.balance + ' 台幣（約' + bulletWan + '萬）'
        + NEWLINE + '昨天加倉：' + (document.getElementById('prevAdded').value||'無')
        + NEWLINE + '市場備註：' + (document.getElementById('marketNote').value||'無'),
      '請依system prompt規則，輸出今日的decision與notification（JSON格式）。'
    ];
    const prompt = promptParts.join(NEWLINE + NEWLINE);

    const wUrl = document.getElementById('workerUrl').value.trim();
    const res = await fetch(wUrl + '/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) {
      throw new Error('Worker回傳無法解析: ' + text.slice(0, 200));
    }
    if (data.error) throw new Error('AI錯誤: ' + data.error);

    const aiText = data.text || '';
    if (!aiText) throw new Error('AI沒有回傳內容');

    const cleanText = aiText.replace(/```json|```/g, '').trim();
    let result;
    try {
      result = JSON.parse(cleanText);
    } catch(e) {
      document.getElementById('aiResult').innerHTML =
        '<div class="card"><div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:10px">完整分析（原始回應）</div><div style="font-size:13px;color:#cbd5e1;line-height:1.8;white-space:pre-wrap">' + aiText + '</div></div>';
      await saveAlertState(currentLevels);
      analyzeBtn.disabled = false; forceBtn.disabled = false; analyzeBtn.textContent = oldAnalyzeText;
      return;
    }

    const plan = result.decision || {};
    const notification = result.notification || '目前無新訊號';
    lastNotification = notification;

    const actionStyle = {
      'BUY':  ['#16a34a','#fff','💰'],
      'HOLD': ['#374151','#9ca3af','⏸'],
      'WAIT': ['#7f1d1d','#fca5a5','⏳'],
    }[plan.action] || ['#374151','#9ca3af','—'];

    const assetName = { 'VOO':'VOO','QQQM':'QQQM','Allianz':'安聯科技','00631L':'00631L','NONE':'—' }[plan.asset] || plan.asset;
    const amountWan = plan.amount_ntd ? (plan.amount_ntd/10000).toFixed(1)+'萬' : '—';

    const hasRealNotif = notification && notification.indexOf('目前無新訊號') === -1;

    document.getElementById('aiResult').innerHTML =
      '<div style="background:'+actionStyle[0]+';border-radius:16px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px">'
        + '<div style="display:flex;align-items:center;gap:12px">'
          + '<div style="font-size:28px">'+actionStyle[2]+'</div>'
          + '<div><div style="font-size:20px;font-weight:800;color:'+actionStyle[1]+'">'+plan.action+(plan.asset && plan.asset!=='NONE' ? ' · '+assetName : '')+'</div>'
          + '<div style="font-size:11px;color:'+actionStyle[1]+';opacity:0.7;margin-top:2px">今日建議</div></div>'
        + '</div>'
        + (plan.amount_ntd ? '<div style="text-align:right"><div style="font-size:22px;font-weight:800;color:'+actionStyle[1]+'">'+amountWan+'</div><div style="font-size:11px;color:'+actionStyle[1]+';opacity:0.7">建議金額</div></div>' : '')
      + '</div>'
      + '<div class="card" style="margin-bottom:10px">'
        + '<div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:6px">📋 判斷原因</div>'
        + '<div style="font-size:13px;color:#cbd5e1;line-height:1.7;margin-bottom:12px">'+(plan.reason||'—')+'</div>'
        + '<div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:6px">➡️ 下一步</div>'
        + '<div style="font-size:13px;color:#cbd5e1;line-height:1.7">'+(plan.next_step||'—')+'</div>'
      + '</div>'
      + '<div class="card" style="margin-bottom:10px">'
        + '<div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:8px">目前各標的警示狀態</div>'
        + '<div>' + badgesHtml + '</div>'
      + '</div>'
      + (hasRealNotif
        ? ('<div class="card" style="margin-bottom:10px;border-color:#0ea5e9">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
              + '<div style="font-size:12px;color:#64748b;font-weight:600">📲 LINE 通知訊息（可複製貼上）</div>'
              + '<button class="btn btn-sm" id="copyNotifBtn" style="background:#0ea5e9;color:#fff" onclick="copyNotification()">複製</button>'
            + '</div>'
            + '<div style="font-size:13px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;background:#0f172a;border-radius:8px;padding:12px;font-family:ui-monospace,monospace">'+notification+'</div>'
          + '</div>')
        : '<div class="card" style="margin-bottom:10px;text-align:center;color:#64748b;font-size:13px">📲 '+notification+'</div>')
      + '<div style="text-align:center;font-size:11px;color:#334155;padding:12px 0">以上為AI判斷，最終決策由你負責</div>';

    await saveAlertState(currentLevels);

  } catch(e) {
    document.getElementById('aiResult').innerHTML = '<div class="error-box" style="font-size:13px">分析失敗：' + e.message + '</div>';
  }

  analyzeBtn.disabled = false; forceBtn.disabled = false;
  analyzeBtn.textContent = oldAnalyzeText;
}

// Init
fetchAll();
setInterval(fetchAll, 30000);
</script>
